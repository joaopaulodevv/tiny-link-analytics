services:
  postgres:
    image: postgres:16
    container_name: tiny_link_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiny_link
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: dev
    container_name: tiny_link_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tiny_link;Username=postgres;Password=postgres"
    volumes:
      - .:/src
      - nuget_cache:/root/.nuget/packages
      - /src/bin
      - /src/obj
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  nuget_cache:
